name: Release Desktop

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: src/apps/ulti/package-lock.json

      - name: Install dependencies
        working-directory: src/apps/ulti
        run: npm ci

      - name: Build installers
        working-directory: src/apps/ulti
        run: npm run release:prep

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ulti-${{ matrix.os }}
          path: |
            src/apps/ulti/release/*.exe
            src/apps/ulti/release/*.dmg
            src/apps/ulti/release/*.AppImage

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate release notes
        run: python .github/scripts/generate_release_notes.py
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/**/*
